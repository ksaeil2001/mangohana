name: PR 2-A validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-02-a-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validate PR 2-A
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.1'
          package-manager-cache: false

      - name: Install dependencies
        run: npm.cmd ci
        shell: pwsh

      - name: Typecheck
        run: npm.cmd run typecheck
        shell: pwsh

      - name: Test
        run: npm.cmd test
        shell: pwsh

      - name: Check Git whitespace
        run: git diff --check
        shell: pwsh
