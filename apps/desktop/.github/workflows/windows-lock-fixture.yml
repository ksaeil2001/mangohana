name: Windows lock fixture validation

on:
  pull_request:
    paths:
      - "src/main/resourcePackInstaller.ts"
      - "tests/main/resourcePackInstaller.test.ts"
      - ".github/workflows/windows-lock-fixture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-lock-fixture-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validate Windows lock fixture
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.12.0"
          package-manager-cache: false

      - name: Install dependencies
        run: npm.cmd ci
        shell: pwsh

      - name: Run focused Windows lock fixture
        run: npm.cmd test -- tests/main/resourcePackInstaller.test.ts --reporter=dot
        shell: pwsh

      - name: Run full test suite
        run: npm.cmd test
        shell: pwsh
